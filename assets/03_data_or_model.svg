<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675">
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="75" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">CNN Architecture</text>
<text x="60" y="112" font-family="Arial" font-size="19" fill="#64748b">Convolution preserves local spatial structure before compact classification.</text>
<g font-family="Arial" text-anchor="middle">
<rect x="45" y="235" width="150" height="180" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="120" y="285" font-size="21" font-weight="700" fill="#1e3a8a">Input</text><text x="120" y="325" font-size="22" fill="#334155">1×8×8</text><text x="120" y="365" font-size="18" fill="#64748b">grayscale image</text>
<rect x="235" y="205" width="170" height="240" rx="16" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="320" y="260" font-size="21" font-weight="700" fill="#166534">Conv + ReLU</text><text x="320" y="305" font-size="22" fill="#334155">16×8×8</text><text x="320" y="350" font-size="18" fill="#64748b">3×3 kernels</text><text x="320" y="382" font-size="18" fill="#64748b">padding = 1</text>
<rect x="445" y="235" width="150" height="180" rx="16" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/><text x="520" y="285" font-size="21" font-weight="700" fill="#155e75">MaxPool</text><text x="520" y="325" font-size="22" fill="#334155">16×4×4</text><text x="520" y="365" font-size="18" fill="#64748b">2×2 pooling</text>
<rect x="635" y="205" width="170" height="240" rx="16" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text x="720" y="260" font-size="21" font-weight="700" fill="#6b21a8">Conv + ReLU</text><text x="720" y="305" font-size="22" fill="#334155">32×4×4</text><text x="720" y="350" font-size="18" fill="#64748b">3×3 kernels</text><text x="720" y="382" font-size="18" fill="#64748b">padding = 1</text>
<rect x="845" y="235" width="150" height="180" rx="16" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><text x="920" y="285" font-size="21" font-weight="700" fill="#9a3412">MaxPool</text><text x="920" y="325" font-size="22" fill="#334155">32×2×2</text><text x="920" y="365" font-size="18" fill="#64748b">= 128 values</text>
<rect x="1035" y="235" width="120" height="180" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="1095" y="285" font-size="21" font-weight="700" fill="#166534">Linear</text><text x="1095" y="325" font-size="22" fill="#334155">128→10</text><text x="1095" y="365" font-size="18" fill="#64748b">digit logits</text>
</g>
<g stroke="#2563eb" stroke-width="5"><path d="M195 325 H235"/><path d="M405 325 H445"/><path d="M595 325 H635"/><path d="M805 325 H845"/><path d="M995 325 H1035"/></g>
<rect x="260" y="515" width="680" height="70" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="558" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">Spatial feature maps shrink from 8×8 → 4×4 → 2×2 while channel depth increases from 1 → 16 → 32.</text>
</svg>